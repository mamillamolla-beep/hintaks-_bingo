<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hintaks Bingo</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  font-family:Arial,sans-serif;
  text-align:center;
  background:#f5f5f5;
  margin:0;
  padding:20px;
}

h1{
  color:#222;
}

#number{
  font-size:55px;
  font-weight:bold;
  margin:20px;
  color:#0088cc;
}

button{
  padding:14px 25px;
  margin:8px;
  border:none;
  border-radius:10px;
  background:#0088cc;
  color:white;
  font-size:18px;
}

button:active{
  transform:scale(.95);
}

table{
  margin:20px auto;
  border-collapse:collapse;
}

th,td{
  width:55px;
  height:55px;
  border:2px solid #333;
  font-size:20px;
  font-weight:bold;
}

th{
  background:#ddd;
}

td{
  background:white;
  cursor:pointer;
}

td.marked{
  background:#7ee081;
}

#message{
  font-size:20px;
  font-weight:bold;
  margin:15px;
}
</style>
</head>

<body>

<h1>🎱 Hintaks Bingo</h1>

<div id="number">--</div>

<button onclick="newNumber()">🎲 ቁጥር አውጣ</button>
<button onclick="newGame()">🔄 አዲስ ጨዋታ</button>

<table>
<thead>
<tr>
<th>B</th>
<th>I</th>
<th>N</th>
<th>G</th>
<th>O</th>
</tr>
</thead>

<tbody id="card"></tbody>
</table>

<div id="message"></div>

<script>

let numbers=[];
let card=[];

function telegramStart(){
  if(window.Telegram && Telegram.WebApp){
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }
}

function createCard(){

  card=[];

  for(let r=0;r<5;r++){

    let row=[];

    for(let c=0;c<5;c++){

      let min=c*15+1;
      let max=min+14;

      let n;

      do{
        n=Math.floor(Math.random()*(max-min+1))+min;
      }while(row.includes(n));

      row.push(n);
    }

    card.push(row);
  }

  card[2][2]="FREE";

  drawCard();
}

function drawCard(){

  let html="";

  for(let r=0;r<5;r++){

    html+="<tr>";

    for(let c=0;c<5;c++){

      let value=card[r][c];

      if(value==="FREE"){
        html+='<td class="marked">FREE</td>';
      }else{
        html+='<td onclick="markCell(this)">'+value+'</td>';
      }

    }

    html+="</tr>";
  }

  document.getElementById("card").innerHTML=html;
}

function markCell(cell){

  cell.classList.toggle("marked");

  checkBingo();
}

function newNumber(){

  if(numbers.length>=75){
    document.getElementById("message").innerText=
      "ሁሉም ቁጥሮች ተጠቅመዋል!";
    return;
  }

  let n;

  do{
    n=Math.floor(Math.random()*75)+1;
  }while(numbers.includes(n));

  numbers.push(n);

  document.getElementById("number").innerText=n;

  checkBingo();
}

function checkBingo(){

  let cells=document.querySelectorAll("#card td");

  let marked=[];

  cells.forEach(cell=>{
    marked.push(cell.classList.contains("marked"));
  });

  for(let r=0;r<5;r++){

    let win=true;

    for(let c=0;c<5;c++){
      if(!marked[r*5+c]) win=false;
    }

    if(win){
      document.getElementById("message").innerText=
        "🎉 BINGO! 🎉";
      return;
    }
  }

  for(let c=0;c<5;c++){

    let win=true;

    for(let r=0;r<5;r++){
      if(!marked[r*5+c]) win=false;
    }

    if(win){
      document.getElementById("message").innerText=
        "🎉 BINGO! 🎉";
      return;
    }
  }

  let win=true;

  for(let i=0;i<5;i++){
    if(!marked[i*5+i]) win=false;
  }

  if(win){
    document.getElementById("message").innerText=
      "🎉 BINGO! 🎉";
    return;
  }

  win=true;

  for(let i=0;i<5;i++){
    if(!marked[i*5+(4-i)]) win=false;
  }

  if(win){
    document.getElementById("message").innerText=
      "🎉 BINGO! 🎉";
  }
}

function newGame(){

  numbers=[];
  document.getElementById("number").innerText="--";
  document.getElementById("message").innerText="";

  createCard();
}

telegramStart();
createCard();

</script>

</body>
</html>
